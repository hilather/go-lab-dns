# Minimal Compose smoke for the hardened image. Pin by digest in GitOps (GIT-001).
# Management (REST /v1, MCP /mcp, operator console GET /): the process binds
# :8080 (every interface in the container). Compose publishes that port on the
# host loopback only (127.0.0.1:8080:8080).
# The publish forwards from the Docker bridge, so the process sees a
# non-loopback peer: with this config (profile omitted = dev-loopback-unauth,
# no token) http://127.0.0.1:8080/v1/... and "Continue as local administrator"
# return 401; under /v1 only /v1/health/live and /v1/health/ready succeed. The
# container log prints the dev-loopback-unauth non-loopback bind warning for [::]:8080.
# For a usable console set spec.management.auth.profile: bearer with a
# secretRef token file and paste the token.
services:
  labdns:
    image: ghcr.io/hilather/labdns:test
    command: ["serve", "--config=/etc/labdns/config.yaml"]
    ports:
      - "53:5353/udp"
      - "53:5353/tcp"
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - "../testdata/container/config.yaml:/etc/labdns/config.yaml:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/labdns", "healthcheck", "--url=http://127.0.0.1:8080/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
