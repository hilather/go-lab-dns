apiVersion: apps/v1
kind: Deployment
metadata:
  name: labdns
  labels:
    app.kubernetes.io/name: labdns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: labdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labdns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: labdns
          # Name only. Apply with `kubectl apply -k` so kustomization.yaml
          # rewrites this to the same digest as image.env. Do not apply -f.
          image: ghcr.io/hilather/labdns
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config=/etc/labdns/config.yaml"]
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: mgmt
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/labdns
              readOnly: true
            - name: token
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
              ephemeral-storage: 64Mi
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: mgmt
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: mgmt
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: labdns-config
        - name: token
          secret:
            secretName: labdns-token
            items:
              - key: token
                path: labdns-token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
