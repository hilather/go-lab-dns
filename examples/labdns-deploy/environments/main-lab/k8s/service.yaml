apiVersion: v1
kind: Service
metadata:
  name: labdns-dns
  labels:
    app.kubernetes.io/name: labdns
    labdns.dev/plane: dns
spec:
  # Preserve the client source IP. Cluster SNAT would make every query
  # look like a node address: NetworkPolicy (10.42.0.0/16) drops it, and
  # refuse-forward classifies the SNATed IP instead of the lab device.
  # Local + one replica is node-local (no cross-node LB). Multi-node
  # labs should use a DaemonSet / hostNetwork path instead.
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: labdns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
# Management is ClusterIP-only. Pair with NetworkPolicy; do not publish 8080.
apiVersion: v1
kind: Service
metadata:
  name: labdns-mgmt
  labels:
    app.kubernetes.io/name: labdns
    labdns.dev/plane: management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: labdns
  ports:
    - name: mgmt
      port: 8080
      targetPort: mgmt
      protocol: TCP
