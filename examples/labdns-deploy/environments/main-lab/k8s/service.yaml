apiVersion: v1
kind: Service
metadata:
  name: labdns-dns
  labels:
    app.kubernetes.io/name: labdns
    labdns.dev/plane: dns
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: labdns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
# Management is ClusterIP-only. Pair with NetworkPolicy; do not publish 8080.
apiVersion: v1
kind: Service
metadata:
  name: labdns-mgmt
  labels:
    app.kubernetes.io/name: labdns
    labdns.dev/plane: management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: labdns
  ports:
    - name: mgmt
      port: 8080
      targetPort: mgmt
      protocol: TCP
