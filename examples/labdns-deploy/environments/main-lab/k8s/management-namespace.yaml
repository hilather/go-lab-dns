apiVersion: v1
kind: Namespace
metadata:
  name: labdns-management
  labels:
    # NetworkPolicy allows :8080 from this label. In-cluster REST/MCP
    # (CI jobs, agents) must run here or in another namespace with the
    # same label. The LabDNS workload namespace is intentionally unlabeled.
    labdns.dev/management: "true"
    app.kubernetes.io/name: labdns
