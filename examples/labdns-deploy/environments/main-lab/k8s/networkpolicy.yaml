apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: labdns-isolate-management
  labels:
    app.kubernetes.io/name: labdns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: labdns
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # DNS data plane from the lab client networks.
    - ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
      from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - podSelector: {}
    # Management only from namespaces labeled labdns.dev/management=true
    # (see management-namespace.yaml). The workload namespace is not labeled.
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              labdns.dev/management: "true"
    # Kubelet HTTP probes come from the node. Host-network kubelet is
    # exempt on some CNIs; Calico/Cilium often still apply this policy.
    # Uncomment and set the cluster node CIDR if Ready never becomes true.
    # - ports:
    #     - port: 8080
    #       protocol: TCP
    #   from:
    #     - ipBlock:
    #         cidr: NODE_CIDR
  egress:
    # Configured upstreams only (see policies/allowed-upstreams.yaml).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.0.0.53/32
        - ipBlock:
            cidr: 10.0.0.54/32
        - ipBlock:
            cidr: 10.0.0.55/32
    # Kubernetes DNS for image-pull/service discovery is cluster-specific;
    # add it here if the CNI requires it. Do not open 0.0.0.0/0.
