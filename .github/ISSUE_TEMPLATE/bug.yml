name: Bug report
description: Report incorrect LabDNS behavior
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, configuration, and packet or API traces if applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Application version, commit, or image digest.
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use [private vulnerability reporting](https://github.com/hilather/go-lab-dns/security/advisories/new).
