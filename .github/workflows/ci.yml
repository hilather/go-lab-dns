# LabDNS continuous integration (FND-001).
#
# Required jobs: format, lint, unit, race, fuzz-smoke, generated-file,
# documentation, security-scan, container-test, changelog, parity,
# config-compat.
#
# There is no optional or bypassable job. Tag creation is gated by
# .github/workflows/release.yml (tag-gate).
#
# container-test builds ghcr.io/hilather/labdns and checks the hardened
# runtime contract (non-root, read-only, no capabilities).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org,direct

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Format
        run: make format
      - name: Tree must stay clean
        run: git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Lint
        run: make lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Unit tests
        run: make test | tee unit.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-logs
          path: unit.log
          retention-days: 14

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Race tests
        run: make test-race | tee race.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: race-logs
          path: race.log
          retention-days: 14

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fuzz smoke
        run: make test-fuzz-smoke | tee fuzz-smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-smoke-logs
          path: fuzz-smoke.log
          retention-days: 14

  generated-file:
    name: generated-file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Verify generated files
        run: make verify-generated

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Documentation checks
        run: make test-docs

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vulnerability scan
        run: make security-scan

  container-test:
    name: container-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Container contract
        run: make test-container

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Changelog entry
        run: make test-changelog

  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: REST/MCP parity
        run: make test-parity | tee parity.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-logs
          path: parity.log
          retention-days: 14

  config-compat:
    name: config-compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Config compatibility
        run: make test-config-compat | tee config-compat.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: config-compat-logs
          path: config-compat.log
          retention-days: 14
