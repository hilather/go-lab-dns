version: "2"

linters:
  # govet matches `make lint`'s first step. The v2 "standard" preset also
  # enables errcheck/unused/staticcheck, which currently flag stack leftovers
  # (unchecked Close, ParseDir deprecation, unused test helpers). Re-enable
  # those linters in a dedicated pass after the 1.0.0-rc.1 tag.
  default: none
  enable:
    - govet

formatters:
  enable:
    - gofmt
