# Explicit spec.ui.enabled: false must survive decode and Load.
apiVersion: labdns.dev/v1alpha1
kind: LabDNS
metadata:
  name: ui-disabled
spec:
  ui:
    enabled: false
  management:
    allowedOrigins:
      - https://dns-mgmt.lab.example
  defaults:
    ttl: 30s
    negativeTTL: 10s
  zones:
    - id: lab-zone
      name: lab.example.net.
      mode: authoritative
      soa:
        primary: ns1.lab.example.net.
        administrator: hostmaster.lab.example.net.
        serial: auto
        refresh: 1h
        retry: 5m
        expire: 24h
      nameservers: [ns1.lab.example.net.]
      records:
        - id: ns1-a
          owner: ns1
          type: A
          values: [10.42.0.53]
