apiVersion: labdns.dev/v1alpha1
kind: LabDNS
metadata:
  name: primary-lab

spec:
  listeners:
    dns:
      address: ":5353"
      protocols: [udp, tcp]
    management:
      address: ":8080"
      restPath: /v1
      mcpPath: /mcp

  access:
    clientGroups:
      - id: test-devices
        cidrs: [10.42.0.0/16]
      - id: management
        cidrs: [10.42.255.0/24]
        chaosExempt: true

  defaults:
    ttl: 30s
    negativeTTL: 10s

  zones:
    - id: lab-zone
      name: lab.example.net.
      mode: authoritative
      soa:
        primary: ns1.lab.example.net.
        administrator: hostmaster.lab.example.net.
        serial: auto
        refresh: 1h
        retry: 5m
        expire: 24h
      nameservers: [ns1.lab.example.net.]
      records:
        - id: ns1-a
          owner: ns1
          type: A
          values: [10.42.0.53]
        - id: tools-wildcard-a
          owner: "*.tools"
          type: A
          ttl: 30s
          values: [10.42.0.20]
          chaosPolicyRefs: [slow-tools]
        - id: grafana-cname
          owner: grafana.tools
          type: CNAME
          values: [gateway.lab.example.net.]

    - id: vendor-overlay
      name: vendor.example.
      mode: overlay
      records:
        - id: vendor-special-a
          owner: special-api
          type: A
          values: [10.42.0.30]

  forwarding:
    policies:
      - id: corp-policy
        suffix: corp.example.net.
        upstreamPool: corporate
      - id: default-policy
        suffix: .
        upstreamPool: default
    pools:
      - id: corporate
        strategy: ordered
        upstreams:
          - id: corp-1
            endpoint: 10.0.0.53:53
            transport: udp
      - id: default
        strategy: health-aware
        upstreams:
          - id: default-1
            endpoint: 10.0.0.54:53
            transport: udp
          - id: default-2
            endpoint: 10.0.0.55:53
            transport: tcp

  cache:
    enabled: true
    maxEntries: 10000
    minimumTTL: 1s
    maximumTTL: 5m
    maximumNegativeTTL: 1m

  chaos:
    enabled: true
    safety:
      protectedNames: [dns.lab.example.net.]
      protectedClientGroups: [management]
      maxDelay: 10s
      maxConcurrentDelayed: 2000
      maxDropProbability: 0.5
    policies:
      - id: slow-tools
        owner: platform-lab
        reason: Test application startup timeouts
        enabled: false
        safetyClass: low
        scope:
          recordIds: [tools-wildcard-a]
          clientGroups: [test-devices]
        selector:
          mode: deterministic
          seed: startup-v1
          probability: 1.0
        outcomes:
          - id: delayed
            weight: 100
            actions:
              - type: delay
                phase: before-response
                distribution: uniform
                min: 100ms
                max: 750ms
