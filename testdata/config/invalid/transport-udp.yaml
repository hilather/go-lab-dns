apiVersion: labdns.dev/v1alpha1
kind: LabDNS
metadata:
  name: transport-udp
spec:
  forwarding:
    policies:
      - id: p
        suffix: .
        upstreamPool: pool
    pools:
      - id: pool
        strategy: ordered
        upstreams:
          - id: u
            endpoint: 10.0.0.1:53
            transport: UDP
